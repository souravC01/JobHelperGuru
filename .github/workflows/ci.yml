name: CI/CD Pipeline

'on':
  push:
    branches:
      - main
      - security/audit-remediation
      - 'ci/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}

permissions:
  contents: read

jobs:
  backend-changes:
    name: Detect Backend Changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check backend deployment paths
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE_SHA=$(git hash-object -t tree /dev/null)
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE_SHA"
          fi
          if git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- \
            backend/ requirements.txt requirements/ Dockerfile.cloudrun .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" -ne 1 ]]; then
              exit "$result"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  backend-ci:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements/runtime.txt
            requirements/dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Verify zero em-dash compliance
        run: |
          python -c "
          import os, sys
          bad_chars = ['\u2014', '\u2013']
          failed = False
          scan_dirs = ['backend', 'frontend/src', 'tests']
          for d in scan_dirs:
              for root, _, files in os.walk(d):
                  for f in files:
                      if f.endswith(('.py', '.js', '.jsx', '.json')):
                          p = os.path.join(root, f)
                          try:
                              text = open(p, encoding='utf-8').read()
                              for c in bad_chars:
                                  if c in text:
                                      print(f'Error: Found unauthorized dash {repr(c)} in {p}')
                                      failed = True
                          except Exception:
                              pass
          if failed:
              sys.exit(1)
          print('Zero em-dash compliance verified across application code.')
          "

      - name: Run Pytest test suite
        env:
          JWT_SECRET_KEY: "ci_test_jwt_secret_key_minimum_32_characters_long_for_security"
          SETTINGS_ENCRYPTION_KEY: "ci_test_settings_encryption_key_32_chars_long"
        run: |
          python -m pytest -q

  frontend-ci:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

  docker-ci:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: jobhelperguru:ci-test

      - name: Build Cloud Run container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cloudrun
          push: false
          tags: jobhelperguru-backend:ci-test

  ci-success:
    name: CI Pipeline Passed
    needs: [backend-ci, frontend-ci, docker-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Validate All Required Checks Passed
        run: echo "All backend, frontend, and Docker validation checks passed successfully."

  deploy-cloud-run:
    name: Deploy Cloud Run Backend
    needs: [ci-success, backend-changes]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.backend-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-east5-docker.pkg.dev/jobhelperguru/jobhelperguru/jobhelperguru-backend:${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build before requesting short-lived credentials.
      - name: Build backend image
        run: docker build --file Dockerfile.cloudrun --tag "$IMAGE" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: jobhelperguru
          workload_identity_provider: projects/999060759573/locations/global/workloadIdentityPools/jobhelperguru-github/providers/github-main
          service_account: jobhelperguru-github-deployer@jobhelperguru.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Push backend image
        run: |
          gcloud auth configure-docker us-east5-docker.pkg.dev --quiet
          docker push "$IMAGE"

      - name: Update Cloud Run image
        run: |
          gcloud run services update jobhelperguru-backend \
            --project=jobhelperguru \
            --region=us-east5 \
            --image="$IMAGE" \
            --quiet

      - name: Verify production health through Vercel
        shell: python
        run: |
          import json
          import time
          import urllib.request

          url = "https://jobhelperguru.vercel.app/api/health"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      health = json.load(response)
                  assert health.get("status") == "ok", "Backend is not healthy"
                  assert health.get("database") == "postgresql", "Unexpected database"
                  assert health.get("object_storage") == "cloudflare_r2", "Unexpected object storage"
                  print("Production health verified: ok, postgresql, cloudflare_r2")
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
